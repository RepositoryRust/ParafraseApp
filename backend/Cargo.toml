[package]
name = "backend-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenv = "0.15.0"
futures-util = "0.3"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7.0", features = ["cors"] }

[dev-dependencies]
axum-test = "21.0.0"
